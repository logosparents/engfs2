                              state.isSubmitted 
                                ? isStudentCorrect 
                                  ? 'bg-emerald-50 border-emerald-500 text-emerald-700' 
                                  : 'bg-rose-50 border-rose-500 text-rose-700 font-bold'
                                : 'border-slate-500 focus:border-indigo-600 bg-slate-50 focus:bg-white'
                            }"
                          />
                          ${state.isSubmitted && !isStudentCorrect ? `<span class="text-xs font-bold text-rose-600 ml-1">(${state.examData.partC.answers[qId]})</span>` : ''}
                        </span>
                      `;
                    } else {
                      parsedHtml += `
                        <span class="inline-block">
                          <strong class="text-sm font-bold text-slate-800">(${i})</strong>
                          <span class="relative inline-block border-b-2 border-slate-800 px-3 min-w-[110px] text-center">
                            ${state.showAnswers ? `<strong class="text-blue-700 font-bold font-serif">${state.examData.partC.answers[qId]}</strong>` : `<span class="opacity-0">placeholder</span>`}
                          </span>
                        </span>
                      `;
                    }

                    text = parts[1] || "";
                  }
                  parsedHtml += `<span>${text}</span>`;
                  return `<p class="leading-10 text-justify">${parsedHtml}</p>`;
                })()}
              </div>
            `}
          </div>
        </section>
      `;

      // ==========================================
      // PART D: PREPOSITIONS
      // ==========================================
      const partD = state.isEditing ? state.editableData.partD : state.examData.partD;
      html += `
        <section class="mb-8 page-break-inside-avoid">
          <div class="flex justify-between items-start border-b-2 border-slate-400 pb-1 mb-3">
            <h4 class="font-bold text-slate-900 text-lg md:text-xl">
              Part D. Prepositions (6 marks, 1 mark each)
            </h4>
            <span class="font-bold text-slate-700 text-base">Marks: _____ / 6</span>
          </div>

          <p class="italic text-slate-700 mb-4 bg-slate-100/70 p-3 rounded print:bg-transparent print:p-0 ${getFontSizeClass('instruction')}">
            ${state.isEditing ? `
              <textarea
                oninput="updateEditableField('partD', null, 'instructions', this.value)"
                class="w-full text-sm font-serif bg-yellow-50 border border-yellow-300 rounded p-1.5 focus:outline-none"
                rows="2"
              >${partD.instructions}</textarea>
            ` : partD.instructions}
          </p>

          <div class="border border-slate-400 border-dashed p-3.5 rounded-lg mb-4 text-center bg-slate-50 print:bg-white">
            ${state.isEditing ? `
              <div class="space-y-2 text-left text-xs">
                <span class="font-bold text-yellow-800">可選介詞（以半型逗號分隔）：</span>
                <input
                  type="text"
                  value="${partD.words.join(', ')}"
                  oninput="state.editableData.partD.words = this.value.split(',').map(w => w.trim());"
                  class="w-full bg-white border border-slate-300 rounded px-2 py-1 text-sm"
                />
              </div>
            ` : `
              <span class="text-base md:text-lg font-bold tracking-wider space-x-6">
                ${partD.words.map((w) => `<span class="inline-block px-2">${w}</span>`).join('')}
              </span>
            `}
          </div>

          <div class="space-y-4 mt-4">
            ${partD.questions.map((q, idx) => {
              let qContent = '';
              if (state.isEditing) {
                qContent = `
                  <div class="space-y-2 bg-yellow-50/50 p-3 rounded border border-yellow-200 text-base">
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-yellow-800 shrink-0">題目句式:</span>
                      <input type="text" value="${q.text}" oninput="updateEditableField('partD', ${idx}, 'text', this.value)" class="flex-1 bg-white border border-slate-300 rounded px-2 py-1" />
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-yellow-800 shrink-0">答案介詞:</span>
                      <input type="text" value="${q.ans}" oninput="updateEditableField('partD', ${idx}, 'ans', this.value)" class="w-48 bg-white border border-slate-300 rounded px-2 py-1" />
                    </div>
                  </div>
                `;
              } else {
                const parts = q.text.split('__________');
                const studentVal = state.studentAnswers[q.id] || "";
                const isStudentCorrect = state.isSubmitted && studentVal.trim().toLowerCase() === q.ans.toLowerCase();

                qContent = `
                  <div>
                    <span>${parts[0]}</span>
                    ${state.mode === 'student' ? `
                      <span class="inline-block px-1">
                        <input
                          type="text"
                          value="${studentVal}"
                          oninput="state.studentAnswers['${q.id}'] = this.value"
                          ${state.isSubmitted ? 'disabled' : ''}
                          class="border-b-2 outline-none text-center font-semibold px-2 py-0.5 w-32 transition-all ${getFontSizeClass('input')} ${
                            state.isSubmitted 
                              ? isStudentCorrect 
                                ? 'bg-emerald-50 border-emerald-500 text-emerald-700' 
                                : 'bg-rose-50 border-rose-500 text-rose-700 font-bold'
                              : 'border-slate-500 focus:border-indigo-600 bg-slate-50 focus:bg-white'
                          }"
                        />
                      </span>
                    ` : `
                      <span class="relative inline-block border-b-2 border-slate-800 px-4 min-w-[120px] text-center">
                        ${state.showAnswers ? `<strong class="text-blue-700 font-bold font-serif">${q.ans}</strong>` : `<span class="opacity-0">${q.ans}</span>`}
                      </span>
                    `}
                    <span>${parts[1]}</span>

                    ${state.mode === 'student' && state.isSubmitted ? `
                      <span class="ml-2">
                        ${isStudentCorrect 
                          ? `<span class="text-emerald-600 font-medium">✓ Correct!</span>` 
                          : `<span class="text-rose-600 font-bold">✗ Incorrect (Ans: <span class="underline font-serif">${q.ans}</span>)</span>`
                        }
                      </span>
                    ` : ''}
                  </div>
                `;
              }

              return `
                <div class="flex items-start gap-3 leading-relaxed ${getFontSizeClass('question')}">
                  <span class="font-bold text-slate-900 min-w-[24px] mt-0.5">${idx + 1}.</span>
                  <div class="flex-1">${qContent}</div>
                </div>
              `;
            }).join('')}
          </div>
        </section>
      `;

      // ==========================================
      // PART E: COMPARATIVE & SUPERLATIVE ADJECTIVES
      // ==========================================
      const partE = state.isEditing ? state.editableData.partE : state.examData.partE;
      html += `
        <section class="mb-8 page-break-inside-avoid">
          <div class="flex justify-between items-start border-b-2 border-slate-400 pb-1 mb-3">
            <h4 class="font-bold text-slate-900 text-lg md:text-xl">
              Part E. Comparative and Superlative Adjectives (10 marks, 2 marks each)
            </h4>
            <span class="font-bold text-slate-700 text-base">Marks: _____ / 10</span>
          </div>

          <p class="italic text-slate-700 mb-4 bg-slate-100/70 p-3 rounded print:bg-transparent print:p-0 ${getFontSizeClass('instruction')}">
            ${state.isEditing ? `
              <textarea
                oninput="updateEditableField('partE', null, 'instructions', this.value)"
                class="w-full text-sm font-serif bg-yellow-50 border border-yellow-300 rounded p-1.5 focus:outline-none"
                rows="2"
              >${partE.instructions}</textarea>
            ` : partE.instructions}
          </p>

          <div class="p-5 border-2 border-slate-200 bg-slate-50/45 rounded-2xl print:p-0 print:border-none print:bg-transparent ${getFontSizeClass('body')}">
            ${state.isEditing ? `
              <div class="space-y-4">
                <div>
                  <span class="text-sm font-bold text-yellow-800 block mb-1">填充短文 (用 (1)__________ 至 (5)__________ 代表空格)：</span>
                  <textarea
                    oninput="updateEditableField('partE', null, 'passage', this.value)"
                    class="w-full text-sm font-serif bg-white border border-slate-300 rounded p-2"
                    rows="6"
                  >${partE.passage}</textarea>
                </div>
                <div class="grid grid-cols-3 gap-3 bg-yellow-50 p-3 rounded border border-yellow-200">
                  <div class="text-xs font-bold text-yellow-800 col-span-3">各空正確形容詞：</div>
                  ${[1,2,3,4,5].map((num) => `
                    <div class="flex items-center gap-1 text-xs">
                      <span>(${num})</span>
                      <input
                        type="text"
                        value="${partE.answers['e' + num] || ''}"
                        oninput="updateEditableField('partE', null, 'answers', this.value, 'e' + ${num})"
                        class="w-28 bg-white border border-slate-300 rounded px-1.5 py-0.5"
                      />
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : `
              <div>
                ${(() => {
                  let text = state.examData.partE.passage;
                  let parsedHtml = '';
                  for (let i = 1; i <= 5; i++) {
                    const placeholder = `(${i})__________`;
                    const parts = text.split(placeholder);
                    parsedHtml += `<span>${parts[0]}</span>`;

                    const qId = `e${i}`;
                    const studentVal = state.studentAnswers[qId] || "";
                    const isStudentCorrect = state.isSubmitted && studentVal.trim().toLowerCase() === state.examData.partE.answers[qId].toLowerCase();

                    if (state.mode === 'student') {
                      parsedHtml += `
                        <span class="inline-block px-1">
                          <span class="text-xs font-bold text-slate-500">(${i})</span>
                          <input
                            type="text"
                            value="${studentVal}"
                            oninput="state.studentAnswers['${qId}'] = this.value"
                            ${state.isSubmitted ? 'disabled' : ''}
                            class="border-b-2 outline-none text-center font-semibold px-2 py-0.5 w-44 transition-all text-sm ${getFontSizeClass('input')} ${
                              state.isSubmitted 
                                ? isStudentCorrect 
                                  ? 'bg-emerald-50 border-emerald-500 text-emerald-700' 
                                  : 'bg-rose-50 border-rose-500 text-rose-700 font-bold'
                                : 'border-slate-500 focus:border-indigo-600 bg-slate-50 focus:bg-white'
                            }"
                          />
                          ${state.isSubmitted && !isStudentCorrect ? `<span class="text-xs font-bold text-rose-600 ml-1">(${state.examData.partE.answers[qId]})</span>` : ''}
                        </span>
                      `;
                    } else {
                      parsedHtml += `
                        <span class="inline-block">
                          <strong class="text-sm font-bold text-slate-800">(${i})</strong>
                          <span class="relative inline-block border-b-2 border-slate-800 px-3 min-w-[120px] text-center">
                            ${state.showAnswers ? `<strong class="text-blue-700 font-bold font-serif">${state.examData.partE.answers[qId]}</strong>` : `<span class="opacity-0">placeholder</span>`}
                          </span>
                        </span>
                      `;
                    }

                    text = parts[1] || "";
                  }
                  parsedHtml += `<span>${text}</span>`;
                  return `<p class="leading-10 text-justify">${parsedHtml}</p>`;
                })()}
              </div>
            `}
          </div>
        </section>
      `;

      // ==========================================
      // PART F: PROOFREADING
      // ==========================================
      const partF = state.isEditing ? state.editableData.partF : state.examData.partF;
      html += `
        <section class="mb-4 page-break-inside-avoid">
          <div class="flex justify-between items-start border-b-2 border-slate-400 pb-1 mb-3">
            <h4 class="font-bold text-slate-900 text-lg md:text-xl">
              Part F. Proofreading (8 marks, 1 mark each)
            </h4>
            <span class="font-bold text-slate-700 text-base">Marks: _____ / 8</span>
          </div>

          <p class="italic text-slate-700 mb-4 bg-slate-100/70 p-3 rounded print:bg-transparent print:p-0 ${getFontSizeClass('instruction')}">
            ${state.isEditing ? `
              <textarea
                oninput="updateEditableField('partF', null, 'instructions', this.value)"
                class="w-full text-sm font-serif bg-yellow-50 border border-yellow-300 rounded p-1.5 focus:outline-none"
                rows="2"
              >${partF.instructions}</textarea>
            ` : partF.instructions}
          </p>

          <div class="space-y-4">
            ${partF.questions.map((q, idx) => {
              const studentVal = state.studentAnswers[q.id] || "";
              const isStudentCorrect = state.isSubmitted && studentVal.trim().toLowerCase() === q.ans.toLowerCase();

              return `
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 text-base md:text-lg leading-relaxed border-b border-slate-200 pb-3 last:border-none">
                  <div class="flex items-start gap-3 flex-1">
                    <span class="font-bold text-slate-900 min-w-[24px] mt-0.5">${idx + 1}.</span>
                    <div class="flex-1">
                      ${state.isEditing ? `
                        <div class="space-y-2 bg-yellow-50/50 p-3 rounded border border-yellow-200 text-base">
                          <div class="flex items-center gap-2">
                            <span class="font-bold text-yellow-800 shrink-0">完整句子:</span>
                            <input type="text" value="${q.text}" oninput="updateEditableField('partF', ${idx}, 'text', this.value)" class="flex-1 bg-white border border-slate-300 rounded px-2 py-1" />
                          </div>
                          <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="flex items-center gap-2">
                              <span class="font-bold text-yellow-800 shrink-0">底線錯誤詞:</span>
                              <input type="text" value="${q.underlined}" oninput="updateEditableField('partF', ${idx}, 'underlined', this.value)" class="w-full bg-white border border-slate-300 rounded px-2 py-1" />
                            </div>
                            <div class="flex items-center gap-2">
                              <span class="font-bold text-yellow-800 shrink-0">正確答案:</span>
                              <input type="text" value="${q.ans}" oninput="updateEditableField('partF', ${idx}, 'ans', this.value)" class="w-full bg-white border border-slate-300 rounded px-2 py-1" />
                            </div>
                          </div>
                        </div>
                      ` : `
                        <div class="${getFontSizeClass('question')}">
                          ${(() => {
                            const sentenceText = q.text;
                            const target = q.underlined;
                            if (!target) return `<span>${sentenceText}</span>`;
                            
                            const escapedTarget = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            const startBoundary = /^\w/.test(target) ? '\\b' : '';
                            const endBoundary = /\w$/.test(target) ? '\\b' : '';
                            const regex = new RegExp(`${startBoundary}${escapedTarget}${endBoundary}`, 'i');
                            
                            const match = sentenceText.match(regex);
                            if (!match) return `<span>${sentenceText}</span>`;
                            
                            const matchIndex = match.index;
                            const before = sentenceText.substring(0, matchIndex);
                            const after = sentenceText.substring(matchIndex + match[0].length);
                            
                            return `
                              <span>
                                ${before}
                                <span class="underline decoration-2 underline-offset-4 font-bold text-slate-900 bg-yellow-100/85 px-1 rounded print:bg-transparent">
                                  ${match[0]}
                                </span>
                                ${after}
                              </span>
                            `;
                          })()}
                        </div>
                      `}
                    </div>
                  </div>

                  ${!state.isEditing ? `
                    <div class="flex items-center justify-end pl-8 md:pl-0">
                      <span class="text-sm text-slate-400 mr-2">Ans:</span>
                      ${state.mode === 'student' ? `
                        <div class="flex flex-col items-end">
                          <input
                            type="text"
                            value="${studentVal}"
                            oninput="state.studentAnswers['${q.id}'] = this.value"
                            ${state.isSubmitted ? 'disabled' : ''}
                            class="border-b-2 outline-none text-center font-semibold px-2 py-0.5 w-36 text-sm transition-all ${getFontSizeClass('input')} ${
                              state.isSubmitted 
                                ? isStudentCorrect 
                                  ? 'bg-emerald-50 border-emerald-500 text-emerald-700' 
                                  : 'bg-rose-50 border-rose-500 text-rose-700 font-bold'
                                : 'border-slate-500 focus:border-indigo-600 bg-slate-50 focus:bg-white'
                            }"
                          />
                          ${state.isSubmitted && !isStudentCorrect ? `<span class="text-xs font-bold text-emerald-600 mt-1 font-serif">(${q.ans})</span>` : ''}
                        </div>
                      ` : `
                        <span class="relative inline-block border-b-2 border-slate-800 px-3 min-w-[140px] text-center">
                          ${state.showAnswers ? `<strong class="text-blue-700 font-bold font-serif">${q.ans}</strong>` : `<span class="opacity-0">${q.ans}</span>`}
                        </span>
                      `}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </section>
      `;

      // Teacher Edit Actions bottom
      if (state.mode === 'teacher' && state.isEditing) {
        html += `
          <div class="mt-8 border-t border-slate-200 pt-6 flex justify-end gap-3 print:hidden">
            <button
              onclick="state.isEditing = false; render();"
              class="px-5 py-2.5 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all"
            >
              放棄修改
            </button>
            <button
              onclick="saveEdits()"
              class="px-6 py-2.5 text-sm font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-sm flex items-center gap-1.5 transition-all"
            >
              ${Icons.Save}
              儲存並更新考卷
            </button>
          </div>
        `;
      }

      // Paper Footer End Marker
      html += `
          <div class="mt-12 text-center text-sm tracking-wider text-slate-400 uppercase border-t border-dashed border-slate-300 pt-4">
            * End of Section II (Usage) *
          </div>
        </div>
      `;

      // Main Container Footer Guide
      html += `
        <div class="mt-8 mb-12 text-center text-xs text-slate-400 print:hidden flex items-center justify-center gap-1">
          ${Icons.HelpCircle}
          提示：點擊「列印 A4 考卷」將會自動隱藏頂部工具列及所有按鈕，只保留完美對齊的 A4 考試紙格式。
        </div>
      </main>
      `;

      container.innerHTML = html;
    };

    window.onload = function() {
      loadSet('SetA');
    };
  </script>
</body>
</html>
